name: PR Forge Autonomous Implementation

on:
  pull_request:
    types: [opened, synchronize, labeled]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request or Issue number to implement/verify'
        required: true
        type: string
      provider:
        description: 'Optional LLM provider override (gemini, anthropic, openai, deepseek)'
        required: false
        default: ''

jobs:
  forge:
    if: |
      github.actor != 'github-actions[bot]' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'pr-forge')) ||
        (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '/forge'))
      )
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR Forge Bot (GitHub Marketplace Action)
        uses: shubhransh-gupta/pr-forge@v1
        with:
          api-key: ${{ secrets.GEMINI_API_KEY || secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
          figma-token: ${{ secrets.FIGMA_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ inputs.pr_number }}
          provider: ${{ inputs.provider }}
          test-command: 'swift test'
          max-iterations: '6'
          auto-commit: 'true'
          post-comment: 'true'
